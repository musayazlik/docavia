# Docavia — project-local development database.
# Runs a dedicated PostgreSQL instance so this project never
# shares data with other containers on the machine.
#
#   docker compose up -d
#   docker compose down        (keeps data)
#   docker compose down -v     (wipes data)

services:
  db:
    image: postgres:17-alpine
    container_name: docavia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: docavia
      POSTGRES_PASSWORD: docavia_dev_pw
      POSTGRES_DB: docavia
    ports:
      # 55432 avoids clashing with the shared postgres on 5432
      - "55432:5432"
    volumes:
      - docavia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docavia -d docavia"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  docavia_pgdata:
