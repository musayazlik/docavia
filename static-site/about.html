<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>About — Docavia</title>
    <meta
      name="description"
      content="Learn about Docavia — our story, our values and the team philosophy behind modern, patient-centered healthcare."
    />
    <meta name="theme-color" content="#2f766d" />
    <link rel="icon" href="assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&amp;family=Instrument+Serif:ital@0;1&amp;family=Manrope:wght@600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/base.css?v=20260926-4" />
    <link rel="stylesheet" href="assets/css/components.css?v=20260926-7" />
    <link rel="stylesheet" href="assets/css/pages.css?v=20260926-8" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div data-nav></div>

    <main id="main">
      <!-- ============================ Page hero ============================= -->
      <section class="page-hero">
        <div class="blob blob--primary" aria-hidden="true"></div>
        <div class="bg-dots masked" aria-hidden="true"></div>
        <div class="shell">
          <nav class="breadcrumb reveal" aria-label="Breadcrumb">
            <a href="index.html" data-bind="navLinks.0.label"></a>
            <span class="breadcrumb__sep" aria-hidden="true">/</span>
            <span class="breadcrumb__current" aria-current="page" data-bind="content.pages.about.label"></span>
          </nav>
          <p class="eyebrow reveal delay-1 mt-6" data-bind="content.pages.about.eyebrow"></p>
          <div class="page-hero__grid">
            <div>
              <h1 class="page-hero__title reveal delay-3">
                <span data-bind="content.pages.about.title"></span>
                <em class="accent" data-bind="content.pages.about.titleAccent"></em>
              </h1>
              <p class="lede reveal delay-5" data-bind="content.pages.about.description"></p>
            </div>
            <div class="page-hero__media reveal delay-4">
              <img class="page-hero__img page-hero__img--focus-top" src="assets/images/hero-doctor.jpg" alt="A Docavia doctor greeting a patient" loading="eager" fetchpriority="high" width="880" height="704" />
            </div>
          </div>
        </div>
      </section>

      <!-- ============================ Our story ============================= -->
      <section class="section section--tight" id="story">
        <div class="shell about__grid">
          <div>
            <div class="section-heading reveal">
              <p class="eyebrow" data-bind="inline.aboutStory.title"></p>
              <h2 class="heading">
                <span data-bind="inline.aboutStory.heading"></span>
                <em class="accent" data-bind="inline.aboutStory.headingAccent"></em>
              </h2>
            </div>
            <div class="article-body reveal delay-1 mt-6">
              <p data-bind="inline.aboutStory.paragraphs.0"></p>
              <p data-bind="inline.aboutStory.paragraphs.1"></p>
              <blockquote>
                <p data-bind="inline.aboutStory.quote"></p>
                <p class="quote-cite">
                  — <span data-bind="inline.aboutStory.quoteCite"></span>
                </p>
              </blockquote>
            </div>
          </div>
          <div class="about__media reveal delay-2">
            <div class="about__dots bg-dots masked" aria-hidden="true"></div>
            <img class="about__img" src="assets/images/about-large.jpg" alt="A Docavia doctor warmly talking with a patient during a consultation" loading="lazy" width="880" height="605" />
            <img class="about__img-small" src="assets/images/about-small.jpg" alt="A Docavia specialist reviewing notes at her desk" loading="lazy" width="208" height="277" />
            <div class="about__badge">
              <p class="about__badge-value">15<span class="accent accent--inverted">+</span></p>
              <p class="about__badge-label">Years of Experience</p>
            </div>
          </div>
        </div>
      </section>

      <!-- =========================== Our values ============================= -->
      <section class="section section--tint" id="values">
        <div class="shell">
          <div class="section-heading section-heading--center reveal">
            <p class="eyebrow" data-bind="inline.aboutValues.eyebrow"></p>
            <h2 class="heading heading--center">
              <span data-bind="inline.aboutValues.title"></span>
              <em class="accent" data-bind="inline.aboutValues.titleAccent"></em>
            </h2>
          </div>
          <div class="doctors-grid reveal-stagger">
            <article class="card card--hover group">
              <span class="well well--lg well--swap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon--lg" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              </span>
              <h3 class="benefit__title mt-6" data-bind="content.about.benefits.0.title"></h3>
              <p class="benefit__text" data-bind="content.about.benefits.0.description"></p>
            </article>
            <article class="card card--hover group">
              <span class="well well--lg well--swap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon--lg" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
              </span>
              <h3 class="benefit__title mt-6" data-bind="content.about.benefits.1.title"></h3>
              <p class="benefit__text" data-bind="content.about.benefits.1.description"></p>
            </article>
            <article class="card card--hover group">
              <span class="well well--lg well--swap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon--lg" aria-hidden="true"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/><path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/></svg>
              </span>
              <h3 class="benefit__title mt-6" data-bind="content.about.benefits.2.title"></h3>
              <p class="benefit__text" data-bind="content.about.benefits.2.description"></p>
            </article>
            <article class="card card--hover group">
              <span class="well well--lg well--swap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon--lg" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="m9 16 2 2 4-4"/></svg>
              </span>
              <h3 class="benefit__title mt-6" data-bind="content.about.benefits.3.title"></h3>
              <p class="benefit__text" data-bind="content.about.benefits.3.description"></p>
            </article>
          </div>
        </div>
      </section>

      <!-- ============================== Stats ============================== -->
      <section class="pt-16 pb-4">
        <div class="shell reveal" data-render="stats"></div>
      </section>

      <!-- ============================= Why us ============================== -->
      <section class="section" id="why-us">
        <div class="shell why__grid">
          <div>
            <div class="section-heading reveal">
              <p class="eyebrow" data-bind="content.whyUs.eyebrow"></p>
              <h2 class="heading">
                <span data-bind="content.whyUs.title"></span>
                <em class="accent" data-bind="content.whyUs.titleAccent"></em>
              </h2>
              <p class="lede" data-bind="content.whyUs.description"></p>
            </div>
            <ol class="why__list reveal-stagger" data-render="whyUsList"></ol>
          </div>
          <div class="why__media reveal">
            <img class="why__img" src="assets/images/why-us.jpg" alt="A Docavia doctor consulting a patient" loading="lazy" width="640" height="520" />
            <div class="why__badge">
              <span class="why__badge-value" data-bind="content.whyUs.badgeValue"></span>
              <span class="why__badge-label" data-bind="content.whyUs.badgeLabel"></span>
            </div>
          </div>
        </div>
      </section>

      <!-- ======================== Appointment CTA ========================= -->
      <section class="cta-band" id="appointment">
        <div class="shell">
          <div class="band-dark reveal" data-render="appointmentCta"></div>
        </div>
      </section>
    </main>

    <div data-footer></div>

    <script src="assets/js/data/site.js"></script>
    <script src="assets/js/data/content.js"></script>
    <script src="assets/js/data/posts.js"></script>
    <script src="assets/js/data/legal.js"></script>
    <script src="assets/js/core.js?v=20260926-2"></script>
    <script src="assets/js/nav.js?v=20260926-6"></script>
    <script src="assets/js/sections.js?v=20260926-8"></script>
    <script src="assets/js/forms.js?v=20260926-2"></script>
    <script src="assets/js/page.js?v=20260926-8"></script>
  </body>
</html>
